# linnux-x Surge upstream sync workflow
# Adapted from Rabbit-Spec/Surge .github/workflows/auto-rules.yml

name: Auto-Surge-Rules

# Daily sync is owned by the local agent pipeline, which runs the same
# scripts and pushes directly (~04:00 Beijing). This workflow is kept for
# manual runs and the dry-run/fingerprint publishing gate only — running
# both on a schedule doubled the daily commits and repo churn.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build rules without committing changes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      manual_audit_confirmed:
        description: "For full generation publishing: confirm manual audit was completed before commit/push"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-surge-rules
  cancel-in-progress: false

jobs:
  update-rules:
    if: github.repository == 'linnux-x/surge'
    runs-on: ubuntu-latest
    # Manual dispatch triggers a full regeneration of all rulesets.
    timeout-minutes: 20

    env:
      RULE_DIR: Rule
      MANUAL_DIR: Rule/Manual
      REPO_URL: https://github.com/linnux-x/surge
      AUTHOR_NAME: linnux-x

    steps:
      - name: Checkout Repository
        # actions/checkout@v5 pinned 2026-07-02
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Check Upstream Updates
        id: check_upstream
        shell: bash
        run: |
          set -euo pipefail
          # Run check. Upstream changes are reported via GitHub outputs;
          # non-zero exit means the checker itself failed and must fail CI.
          # Candidate state is promoted to scripts/source_state.json only after
          # generation/validation/audit succeeds.
          python3 scripts/check_upstream_updates.py \
            --state-out scripts/source_state.next.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Compute Build Gate
        id: gate
        shell: bash
        env:
          CHANGED_COUNT: ${{ steps.check_upstream.outputs.changed_count }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Single source of truth for "should we (re)generate this run?":
          # any upstream changed, or a manual dispatch (which forces full regen).
          if [ "${CHANGED_COUNT:-0}" -gt 0 ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Rules
        id: generate
        if: ${{ steps.gate.outputs.build == 'true' }}
        shell: bash
        env:
          CHANGED_RULESETS: ${{ steps.check_upstream.outputs.changed_rulesets }}
        run: python3 scripts/generate_rules.py

      - name: Generate Manifests & Diff
        if: ${{ steps.gate.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manifest.py
          python3 scripts/manifest.py --diff

      - name: Generate Clash Rule Providers
        if: ${{ steps.gate.outputs.build == 'true' }}
        shell: bash
        run: python3 scripts/generate_clash_rules.py --validate

      - name: Validate Repository Invariants
        if: ${{ steps.gate.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_surge_repo.py

      - name: Online Audit (Upstream & Shared Infrastructure)
        if: ${{ steps.gate.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_rules.py

      - name: Compute Full Generation Manifest Fingerprint
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          manifest_dir = Path("Rule/.manifests")
          manifest_paths = sorted(manifest_dir.glob("*.manifest"))
          if not manifest_paths:
              raise SystemExit("No manifest files found for full-generation audit fingerprint")

          digest = sha256()
          for path in manifest_paths:
              digest.update(path.as_posix().encode("utf-8") + b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")

          fingerprint = digest.hexdigest()
          out = Path("scripts/full_generation_manifest.sha256")
          out.write_text(fingerprint + "\n", encoding="utf-8")
          print(f"manifest_fingerprint={fingerprint}")
          PY

      - name: Verify Reviewed Manifest Fingerprint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true' && inputs.manual_audit_confirmed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_url=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=full-generation-manifest-fingerprint&per_page=20" \
            --jq '.artifacts[] | select(.expired == false) | .archive_download_url' \
            | head -n 1)

          if [ -z "$artifact_url" ]; then
            echo "::error::No dry-run manifest fingerprint artifact found. Run workflow_dispatch with dry_run=true and review that output first."
            exit 1
          fi

          gh api "$artifact_url" > /tmp/full-generation-manifest-fingerprint.zip

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          current = Path("scripts/full_generation_manifest.sha256").read_text(encoding="utf-8").strip()
          with ZipFile("/tmp/full-generation-manifest-fingerprint.zip") as zf:
              names = [n for n in zf.namelist() if n.endswith("full_generation_manifest.sha256")]
              if not names:
                  raise SystemExit("::error::Dry-run artifact does not contain full_generation_manifest.sha256")
              reviewed = zf.read(names[0]).decode("utf-8").strip()

          if current != reviewed:
              raise SystemExit(
                  "::error::Full generation manifest fingerprint differs from the reviewed dry-run artifact. "
                  "Run dry_run=true again and re-review before publishing."
              )
          print(f"Manifest fingerprint matches reviewed dry-run artifact: {current}")
          PY

      - name: Sync DNS Mapping Module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Module
          old_size=0
          if [ -f Module/DNS-Mapping.sgmodule ]; then
            old_size=$(wc -c < Module/DNS-Mapping.sgmodule)
          fi
          curl --fail --location --retry 3 --retry-delay 5 \
            --output Module/DNS-Mapping.sgmodule \
            https://ruleset.skk.moe/Modules/sukka_local_dns_mapping.sgmodule
          new_size=$(wc -c < Module/DNS-Mapping.sgmodule)
          if [ "$new_size" -lt 500 ] || [ "$new_size" -gt 10000 ]; then
            echo "::error::DNS mapping module size out of expected range: ${new_size} bytes"
            exit 1
          fi
          if [ "$old_size" -gt 0 ]; then
            lower=$(( old_size * 60 / 100 ))
            upper=$(( old_size * 160 / 100 ))
            if [ "$new_size" -lt "$lower" ] || [ "$new_size" -gt "$upper" ]; then
              echo "::error::DNS mapping module size changed unexpectedly: ${old_size} -> ${new_size} bytes"
              exit 1
            fi
          fi
          grep -qx '\[Host\]' Module/DNS-Mapping.sgmodule
          grep -q '^RULE-SET:https://ruleset\.skk\.moe/Modules/Rules/sukka_local_dns_mapping/' Module/DNS-Mapping.sgmodule
          # Section whitelist: the module must contain ONLY the [Host] section.
          # Size + [Host] checks alone would still let a tampered upstream
          # smuggle a [Script], [MITM], [URL Rewrite] or [Rule] section within
          # the 10 KB budget. Refuse anything but [Host].
          if grep -E '^\[' Module/DNS-Mapping.sgmodule | grep -qvxF '[Host]'; then
            echo "::error::DNS mapping module contains a non-[Host] section — refusing to sync:"
            grep -E '^\[' Module/DNS-Mapping.sgmodule | grep -vxF '[Host]' || true
            exit 1
          fi
          # Match by pattern, not line number: robust if upstream reorders the
          # header, and normalizing #!desc drops upstream's changing timestamp
          # (avoids daily commit churn).
          sed -i 's|^#!name=.*|#!name=DNS-Mapping|' Module/DNS-Mapping.sgmodule
          sed -i 's|^#!desc=.*|#!desc=本地 DNS 映射，优化国内常用服务与局域网域名解析|' Module/DNS-Mapping.sgmodule

      - name: Manual Audit Gate for Full Generation Publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true' && inputs.manual_audit_confirmed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Full generation publish requires manual audit before commit/push. First run dry_run=true, review Rule/ + manifests + diff_report + audit output, then rerun with manual_audit_confirmed=true."
          exit 1

      - name: Commit and Push Changes
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/source_state.next.json ]; then
            mv scripts/source_state.next.json scripts/source_state.json
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Rule/ clash/ Module/ README.md \
            scripts/diff_report.md scripts/diff_report.json scripts/source_state.json

          if ! git diff --staged --quiet; then
            COMMIT_TIME=$(TZ="Asia/Shanghai" date +"%Y-%m-%d %H:%M:%S +0800")
            git commit -m "$COMMIT_TIME Update rules"
            # --autostash guards against any stray unstaged changes blocking the
            # rebase; a genuine content conflict still fails loudly (and opens an
            # issue) since generated files are machine-owned and should not clash.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Dry Run Summary
        if: ${{ inputs.dry_run == 'true' }}
        shell: bash
        run: |
          echo "::notice::Dry run enabled. Changes were generated and validated, but will NOT be committed."
          git status --short

      - name: Upload Dry Run Manifest Fingerprint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        # actions/upload-artifact@v4 pinned 2026-07-02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-generation-manifest-fingerprint
          path: scripts/full_generation_manifest.sha256
          if-no-files-found: error
          retention-days: 14

