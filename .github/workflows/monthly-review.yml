name: Monthly Review

on:
  schedule:
    # Last day of month at 22:17 UTC = 1st of next month at 06:17 Beijing
    # Runs daily on days 28-31, exits early unless tomorrow is the 1st
    - cron: "17 22 28-31 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monthly-review:
    if: github.repository == 'linnux-x/surge'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout@v5 pinned 2026-07-02
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Check if last day of month
        id: month_gate
        shell: bash
        run: |
          if [ "$(date -d tomorrow +%d)" != "01" ]; then
            echo "Not the last day of month — skipping monthly review."
            echo "is_last_day=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last day of month — running full review."
          echo "is_last_day=true" >> "$GITHUB_OUTPUT"

      - name: Full Rule Validation
        if: steps.month_gate.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: python3 scripts/validate_surge_repo.py --ci

      - name: Online Audit (All Checks)
        if: steps.month_gate.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: python3 scripts/audit_rules.py

      - name: Manifest Integrity Check
        if: steps.month_gate.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manifest.py
          python3 scripts/manifest.py --diff

      - name: Upstream Health Report
        if: steps.month_gate.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          report="reports/$(TZ='Asia/Shanghai' date +'%Y-%m').md"
          echo "# Monthly Upstream Health Report" > "$report"
          echo "## Generated: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S +0800')" >> "$report"
          echo "" >> "$report"
          echo "### Source Status" >> "$report"
          python3 scripts/check_upstream_updates.py >> "$report" 2>&1
          echo "" >> "$report"
          echo "### Rule Counts" >> "$report"
          for f in Rule/*.list; do
            count=$(awk '!/^#/ && !/^[[:space:]]*$/ {n++} END {print n+0}' "$f")
            echo "- $(basename "$f"): $count rules" >> "$report"
          done
          echo "" >> "$report"
          python3 scripts/cross_file_conflicts.py >> "$report"

      - name: Commit Monthly Report
        if: steps.month_gate.outputs.is_last_day == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -d reports ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add reports/ Rule/ scripts/diff_report.md scripts/diff_report.json
            if ! git diff --staged --quiet; then
              git commit -m "Monthly review: $(TZ='Asia/Shanghai' date +'%Y-%m')"
              git pull --rebase origin main
              git push
            fi
          fi

      - name: Open Issue on Scheduled Failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Monthly Review scheduled run failed"
          if gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Existing open failure issue found; not creating a duplicate."
            exit 0
          fi
          gh issue create \
            --title "$title" \
            --body "Scheduled Monthly Review failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
