name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'linnux-x/surge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v5 pinned 2026-07-02
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Validate Rule Syntax & Project Policies
        run: python3 scripts/validate_surge_repo.py --ci
      - name: Validate Generation Receipt
        run: python3 scripts/generate_receipt.py && git diff --exit-code -- scripts/generation_receipt.json scripts/generation_receipt.md
      - name: Validate Clash Rule Providers
        run: python3 scripts/generate_clash_rules.py --check --validate
      - name: Test Routing Order
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/test_routing_order.py
      - name: Cross-file Conflict Summary (informational)
        run: python3 scripts/cross_file_conflicts.py --summary
