name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'linnux-x/surge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v5 pinned 2026-07-02
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Validate, Test and Check Receipt
        # Same entry point the daily job and full generation use.
        run: python3 scripts/pipeline.py verify --ci
      - name: Test Looking Glass module
        run: node tests/test_route_trace.js
